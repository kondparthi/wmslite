name: Deploy WMS Lite to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (native, no Docker)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            if [ ! -d /opt/wmslite/.git ]; then
              echo "ERROR: /opt/wmslite is not set up yet. Run the one-time setup first (see README)." >&2
              exit 1
            fi
            bash /opt/wmslite/scripts/redeploy.sh
