# Nginx site config for WMS Lite — HTTPS via a self-signed certificate (bare IP, no domain).
# Installed to /etc/nginx/sites-available/wmslite by scripts/setup-selfsigned-ssl.sh.
# Browsers will show a "not trusted" warning once, since no CA issues certs for bare IPs —
# switch to deploy/nginx-wmslite.conf + real Let's Encrypt certs once a domain is pointed here.

server {
    listen 80;
    server_name 201.18.214.64;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 201.18.214.64;

    ssl_certificate     /etc/ssl/wmslite/selfsigned.crt;
    ssl_certificate_key /etc/ssl/wmslite/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/wmslite/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
